name: Add to bitácora

# Puts every opened/reopened issue and PR onto the cross-repo bitácora board
# (GitHub Project #1). Pairs with bitacora-status.yml (which flips an assigned
# issue to In Progress). Canonical copy for the OPS-002 (#258) multi-repo rollout.

# Note: actions/add-to-project@v1 only supports issues, not PRs. We use it for
# issues and fall back to gh project item-add for PRs.

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened]

jobs:
  add-to-project:
    # Fork PRs and Dependabot PRs run without repository secrets — BITACORA_PAT
    # would be empty and the job would fail (Codex review on kubelab#237; GitHub
    # does not expose secrets to Dependabot PRs). Skip both; those PRs reach the
    # board via the rollout backfill or a manual item-add.
    if: github.event_name == 'issues' || (github.event.pull_request.head.repo.fork == false && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      # Issues: use the official action (works fine for issues).
      # Pinned to the v1.0.2 commit SHA (supply-chain security — mutable
      # semver tags can be moved).
      - name: Add issue to project
        if: github.event_name == 'issues'
        uses: actions/add-to-project@5afcf98fcd03f1c2f92c3c83f58ae24323cc57fd # v2.0.0
        with:
          project-url: https://github.com/users/mlorentedev/projects/1
          github-token: ${{ secrets.BITACORA_PAT }}

      # PRs: the gh project CLI fails with "unknown owner type" under a
      # fine-grained PAT (see bitacora-status.yml note), so use the same
      # github-script + GraphQL path that is proven there. PR_URL via env to
      # avoid shell template injection (zizmor).
      - name: Add PR to project
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.BITACORA_PAT }}
          script: |
            const projectId = 'PVT_kwHOAM7xJs4BZ6GY';
            const contentId = context.payload.pull_request.node_id;
            await github.graphql(
              `mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                  item { id }
                }
              }`,
              { projectId, contentId },
            );
            core.info(`Added PR #${context.payload.pull_request.number} to the bitácora board`);
