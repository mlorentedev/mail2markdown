# PR-Agent (The-PR-Agent/pr-agent, MIT) on NaN cluster inference.
#
# Why this repo needs a second reviewer, measured rather than assumed (2026-09-06,
# every PR CodeRabbit has seen here — it was enabled between #19 and #21):
#
#   real CodeRabbit review (`## Walkthrough`)    3   (#21 #22 #23)
#   quota decline (`Review limit reached`)       1   (#23, same comment as its walkthrough)
#   `Review skipped`                             0
#
# Three data points is a thin measurement, recorded as such; the sibling repos measured
# the same decline at 59 % over 29 PRs (ts-bridge) and the cause is the vendor's quota,
# not this repo's diffs. CodeRabbit is not a check-run in this repository at all — the
# only CI job is `quality` (ruff, mypy, pytest) and master has no branch protection —
# so a declined review leaves no trace in CI and nothing says so. That is the queue
# this removes: a reviewer whose capacity is ours rather than a vendor's.
#
# Ported from mlorentedev/dotfiles (`.pr_agent.toml`, TOOL-013 #786) via the
# mlorentedev/kubelab adaptation (TOOL-021 #1140) and the mlorentedev/ts-bridge port.
# Numbers, paths and the ignore list below are re-derived for this repo; the
# model-chain reasoning is inherited and cited by issue so it can be checked at source.

[config]
# The model, its fallback and the token budgets are set by the shared workflow
# (mlorentedev/ci-workflows pr-agent.yml) through environment variables, which sit
# above this file, so they are not repeated here.

response_language = "en-US"

# `AGENTS.md` is the only context file that exists here. No root `CLAUDE.md` and no
# `.claude/CLAUDE.md` (both checked 2026-09-06), so naming either would hand the
# reviewer a source it cannot read — a rule that looks like rigour and asserts nothing.
repo_context_files = ["AGENTS.md"]

[pr_reviewer]
require_score_review = false
require_tests_review = true
require_security_review = true
persistent_comment = true
final_update_message = false

# No "compliance sweep" preamble: asked for on every review and delivered once in
# sixteen at dotfiles (#1072, recommendation was deletion). An instruction ignored 94 %
# of the time is a comment, not a control.
extra_instructions = """
Classify each finding as REAL, THEORETICAL or SPECULATIVE. State the class as
the first line of its issue_content, alone on that line and spelled exactly
"Class: REAL", "Class: THEORETICAL" or "Class: SPECULATIVE". The triage reads
only that line; a finding without it goes to a human unclassified.

This repository already runs ruff (E, W, F, I, B), mypy with disallow_untyped_defs and
pytest on Linux in CI. Do not restate what those report; repeating it is noise that
trains the reader to skim.

Spend the budget on what static analysis cannot see:

- a test that passes vacuously. This repo has a named class of it: `win32com` is not
  installed on the Linux CI runner, so tests stub it into `sys.modules` before import
  (docs/lessons/lesson-003-solution.md). A test whose assertions land on a MagicMock
  that accepts anything is not testing the COM path it claims to; a finding on that is
  worth more than a style note.
- a guard that cannot fail the way its comment claims, or that perturbs the thing it
  measures.
- the retry contract for COM interop and network calls (AGENTS.md standing order 8:
  three attempts, 1s/4s/9s jittered, every retry logged, the full chain surfaced on
  final failure). A swallowed exception or a bare `except` on that path is a REAL
  finding.
- encoding and Windows path handling: non-ASCII subjects and bodies have crashed CSV
  output before (#11), and the tool runs on Windows while CI runs on Linux, so a path
  or encoding assumption that only holds on one of them will not be caught by CI.
- dry-run and manifest side effects: `--dry-run` must write nothing (#14 fixed a
  manifest write that escaped it). Any new write path needs the same guard.
- cross-file consequences a single-hunk reader misses: a claim repeated in README,
  `docs/runbooks/`, `docs/lessons/` and AGENTS.md where only one of them is edited, or a
  documented Typer option that the CLI does not actually declare.
- anything that puts a credential or a mailbox's contents in a transcript, a log line,
  an argv or the process table, including in documentation examples.

A REAL finding needs a concrete
trace: file and line, failing input, or a command and its output. Do not flag an import
or dependency as missing when CI compiles and tests pass; trust the manifests. Write in
English. Conventional Commits and no AI attribution are enforced here, so do not propose
commit messages that carry either.
"""

[pr_code_suggestions]
# Present on purpose. Omitting this block is how upstream shipped the tool with its
# stated function disabled: the default `dual_publishing_score_threshold` is -1, which
# never publishes inline (dotfiles measured 2 bot comments and 0 inline across three
# PRs before noticing). 7 is upstream's own medium boundary.
dual_publishing_score_threshold = 7
suggestions_score_threshold = 5
publish_output_no_suggestions = false

[ignore]
# Applied BEFORE the model call. This repo keeps no credential material in-tree (no
# SOPS/age store, no keys — the only secrets live in GitHub's own stores), so this list
# is about spend and signal, not leakage (paths checked against `git ls-files` on
# 2026-09-06; there is no site/ or coverage artefact here):
#   - the generated review transcript is a machine artefact;
#   - poetry.lock is resolved dependency metadata a human already reviewed in the PR
#     that bumped it, and lockfiles are excluded from the review cap by policy;
#   - archived specs (specs/archive/ exists here) are a closed audit trail,
#     re-reviewing them spends inference on text that has already been reviewed once.
glob = [
  "specs/**/review-transcript.jsonl*",
  "specs/archive/**",
  "poetry.lock",
  "**/*.log",
]
